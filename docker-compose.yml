# 生产环境编排（阿里云轻量应用服务器：2 核 / 2 GiB / 40 GiB）
#
# ⚠️ 部署是一期功能在本机验收通过后的独立事项，见《需求文档》§8.2。
#    在此之前本文件仅作为目标状态的定义，不需要执行。
#
# ⚠️ 前置条件：
#    1. backend/Dockerfile 与 frontend/Dockerfile 需先存在
#    2. 前端镜像必须在本机构建后推送，或使用多阶段 Dockerfile 在本机 build。
#       **绝不能在服务器上执行 next build** —— Node 构建内存峰值超过 1.5 GB，
#       会直接拖死 2 GiB 的机器（技术方案 §11.1）
#    3. 服务器需先配置 4 GB Swap（技术方案 §11.3）
#
# 内存预算见《技术方案》§11.4，各服务的 limits 之和约 1.16 GB，
# 为系统与页缓存留出约 880 MB。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: blog-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LANG: C.UTF-8
    # 默认配置会按「本机是数据库专用服务器」分配内存，2 GiB 机器上必须压低
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=20
      -c work_mem=4MB
      -c effective_cache_size=512MB
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # ⚠️ 不映射端口到宿主机，数据库仅容器内网可达（NFR-SEC）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 400M

  api:
    build: ./backend
    container_name: blog-api
    restart: always
    env_file: .env
    environment:
      # 容器内数据库走服务名，端口是容器内部的 5432
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATA_DIR: /app/data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 上传的原始文件与文章配图，需与数据库一同备份（NFR-OPS-01）
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 400M

  web:
    build: ./frontend
    container_name: blog-web
    restart: always
    environment:
      NODE_ENV: production
      # SSR 时由 Node 进程访问后端，走容器内网
      INTERNAL_API_BASE: http://api:8000
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 300M

  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    restart: always
    # 配置文件与对外端口由 .env 控制，便于在「备案前过渡」与「正式上线」之间切换：
    #   过渡期（未备案）NGINX_CONF=nginx.http.conf  HTTP_PORT=8080
    #   正式上线（已备案）NGINX_CONF=nginx.conf      HTTP_PORT=80
    # 大陆地域服务器未备案时不得通过 80 端口对外提供网站服务，故过渡期用高位端口。
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          memory: 64M
