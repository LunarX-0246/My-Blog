## 过渡期 Nginx 配置（ICP 备案完成前使用）
##
## 与正式配置 nginx.conf 的唯一区别：**不加载 SSL 证书、不跳转 HTTPS**。
## 证书要靠 Let's Encrypt 验证域名归属才能签发，没有已备案的域名签不出来；
## 而 nginx.conf 里写死了证书路径，文件不存在时 nginx 会**启动失败**，整个 compose 起不来。
##
## 访问方式：http://<服务器IP>:<HTTP_PORT>（.env 里设 HTTP_PORT=8080）
##   大陆地域服务器未备案时不得通过 80 端口对外提供网站服务，因此用高位端口自测。
##
## 备案通过后：把 .env 的 NGINX_CONF 改回 nginx.conf、HTTP_PORT 改回 80，
##            签发证书，重启 nginx 容器即可。本文件可保留备用。

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;

    # 上传单文件上限 50 MB（FR-DOC-02），留出余量
    client_max_body_size 60M;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        image/svg+xml;

    server {
        # 容器内固定监听 80，对外映射到哪个端口由 compose 的 HTTP_PORT 决定
        listen 80;
        server_name _;

        # ══════════════════════════════════════════════════════
        #  后端 API
        # ══════════════════════════════════════════════════════
        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ★★★ 流式问答的生死线 —— 过渡期同样必须关闭缓冲 ★★★
            #
            # 不关的话 Nginx 会攒够一整块才转发，打字机效果消失，
            # NFR-PERF-02（第一个字 3 秒内出现）作废。
            #
            # 这个问题本机开发完全正常（不经过 Nginx），只在部署后出现 ——
            # 过渡期部署的价值之一，正是提前验证这一项确实配对了。
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  300s;
            chunked_transfer_encoding on;
            proxy_set_header Connection '';
        }

        # ══════════════════════════════════════════════════════
        #  前端页面
        # ══════════════════════════════════════════════════════
        location /_next/static/ {
            proxy_pass http://web:3000;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
