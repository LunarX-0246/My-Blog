## 生产环境 Nginx 配置
##
## ⚠️ 部署阶段才需要，见《需求文档》§8.2。
## ⚠️ 使用前把 yourdomain.com 换成实际域名（需先完成 ICP 备案）。
##
## 路径分流（技术方案 §1.2）：
##   /api/*  →  FastAPI    业务与流式问答
##   /*      →  Next.js    页面渲染

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;

    # 上传单文件上限 50 MB（FR-DOC-02），留出余量
    client_max_body_size 60M;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        image/svg+xml;

    # ── HTTP：仅用于证书续期与跳转 HTTPS ──────────────────────
    server {
        listen 80;
        server_name yourdomain.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS 主站 ───────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name yourdomain.com;

        ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ══════════════════════════════════════════════════════
        #  后端 API
        # ══════════════════════════════════════════════════════
        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ★★★ 流式问答的生死线 ★★★
            #
            # 不关闭缓冲，Nginx 会攒够一整块才转发，打字机效果彻底消失，
            # NFR-PERF-02（第一个字 3 秒内出现）直接作废。
            #
            # 这个问题的恶劣之处在于：本机开发完全正常（不经过 Nginx），
            # 只在部署后才出现，极易误判为后端流式写错了。
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  300s;
            chunked_transfer_encoding on;

            # SSE 需要长连接
            proxy_set_header Connection '';
        }

        # ══════════════════════════════════════════════════════
        #  前端页面
        # ══════════════════════════════════════════════════════
        location /_next/static/ {
            proxy_pass http://web:3000;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
