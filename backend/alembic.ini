# Alembic migration config
#
# NOTE: the DB URL is NOT stored here (it contains credentials).
# alembic/env.py reads DATABASE_URL from .env via app.config and injects it.
#
# WARNING: this .ini is read by configparser with encoding="locale",
# which on Windows is GBK - so keep this file ASCII-only (no Chinese comments),
# otherwise `alembic` fails with a UnicodeDecodeError. Chinese comments go in
# the .py files (env.py, migrations), which Python reads as UTF-8.

[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
